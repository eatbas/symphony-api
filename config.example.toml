[server]
host = "127.0.0.1"
port = 8000

[shell]
# On Windows the app prefers Git Bash automatically when this is empty.
path = ""

[storage]
# Leave empty to use ~/.maestro/symphony/scores, or set a writable absolute path.
score_dir = ""

[providers.antigravity]
# Google Antigravity CLI (`agy`) — successor to Gemini CLI. Install via:
#   curl -fsSL https://antigravity.google/cli/install.sh | bash
# Model selection happens in ~/.gemini/antigravity-cli/settings.json
# (no `--model` flag yet); the models below seed musician pools.
enabled = true
executable = ""
models = [
  "gemini-3.5-flash",
  "gemini-3.1-pro",
]
default_options = { extra_args = [] }
# Desktop app manages timeouts via agent_timeout_ms; 0 = no sidecar timeout.
cli_timeout = 0
# Seconds without any CLI output before assuming the process is stuck; 0 = disabled.
idle_timeout = 0

[providers.codex]
enabled = true
executable = ""
models = [
  "gpt-5.4",
  "gpt-5.4-mini",
]
default_options = { extra_args = [] }
cli_timeout = 0
idle_timeout = 0

[providers.claude]
enabled = true
executable = ""
models = [
  "haiku",
  "opus",
  "opus[1m]",
  "sonnet",
]
default_options = { extra_args = [] }
cli_timeout = 0
idle_timeout = 0

[providers.kimi]
enabled = true
executable = ""
models = ["kimi-code/kimi-for-coding"]
default_options = { extra_args = [] }
cli_timeout = 0
idle_timeout = 0

[updater]
enabled = true
interval_hours = 4
auto_update = true
