[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symphony"
version = "0.1.0"
description = "Symphony — coordinated AI CLI collective (Antigravity, Codex, Claude, Kimi)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.135,<1.0",
  "uvicorn[standard]>=0.42,<1.0",
  "pydantic>=2.12,<3.0",
  "httpx>=0.28,<1.0",
  "python-dotenv>=1.0,<2.0",
  # Antigravity (`agy --print`) refuses to write to non-TTY stdout on
  # Windows. The adapter wraps it in a pseudo-terminal via the
  # in-tree ``agy_pty_runner`` module, which talks to ConPTY (Windows
  # 10+) directly through ctypes, so no external Windows dependencies
  # are required.
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0,<10.0",
  "pytest-asyncio>=1.3,<2.0",
  "pytest-cov>=7.0,<8.0",
  "playwright>=1.58,<2.0",
  "pytest-playwright>=0.7,<1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
symphony = ["ui/*.html", "ui/static/*.css", "ui/static/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=src/symphony --cov-report=term-missing --cov-fail-under=100 --ignore=tests/ui_e2e"

[tool.coverage.run]
source = ["src/symphony"]
omit = [
  "src/symphony/ui/*",
  "src/symphony/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "^\\s*\\.\\.\\.$",
  "@(abc\\.)?abstractmethod",
]
