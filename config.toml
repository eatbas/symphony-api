[server]
host = "0.0.0.0"
port = 8080

[shell]
# On Windows the app prefers Git Bash automatically when this is empty.
path = ""

[providers.antigravity]
# Google Antigravity CLI (`agy`). Install via:
#   curl -fsSL https://antigravity.google/cli/install.sh | bash
enabled = true
executable = ""
models = [
  "gemini-3.5-flash",
  "gemini-3.1-pro-high",
  "gemini-3.1-pro-low",
  "gemini-3-flash",
  "claude-sonnet-4.6-thinking",
  "claude-opus-4.6-thinking",
  "gpt-oss-120b",
]
default_options = { extra_args = [] }
# Desktop app manages timeouts via agent_timeout_ms; 0 = no sidecar timeout.
cli_timeout = 0
# Seconds without any CLI output before assuming the process is stuck; 0 = disabled.
idle_timeout = 0

[providers.codex]
enabled = true
executable = ""
models = [
  "gpt-5.2",
  "gpt-5.3-codex",
  "gpt-5.4",
  "gpt-5.4-mini",
  "gpt-5.5",
]
default_options = { extra_args = [] }
cli_timeout = 0
idle_timeout = 0

[providers.claude]
enabled = true
executable = ""
models = [
  "haiku",
  "opus",
  "opus[1m]",
  "sonnet",
]
default_options = { extra_args = [] }
cli_timeout = 0
idle_timeout = 0

[providers.kimi]
enabled = true
executable = ""
models = ["kimi-code/kimi-for-coding"]
default_options = { extra_args = [] }
cli_timeout = 0
idle_timeout = 0

[providers.opencode]
# Backed by OpenRouter's free tier — Symphony rediscovers the live
# top-10 free text-output models on each periodic refresh.  Leave
# ``models`` empty here; discovery populates it at start-up.
enabled = true
executable = ""
models = [
  "openrouter/deepseek/deepseek-v4-flash:free",
  "openrouter/qwen/qwen3-coder:free",
  "openrouter/nvidia/nemotron-3-super-120b-a12b:free",
  "openrouter/google/gemma-4-26b-a4b-it:free",
  "openrouter/google/gemma-4-31b-it:free",
  "openrouter/moonshotai/kimi-k2.6:free",
  "openrouter/poolside/laguna-m.1:free",
  "openrouter/poolside/laguna-xs.2:free",
  "openrouter/qwen/qwen3-next-80b-a3b-instruct:free",
  "openrouter/nvidia/nemotron-3-nano-30b-a3b:free",
]
default_options = { extra_args = [] }
cli_timeout = 0
idle_timeout = 0
# OpenRouter free models share one global rate limit per API key; lazy
# spawn keeps idle musicians off the boot path until first request.
lazy = true

[updater]
enabled = true
interval_hours = 4
auto_update = true
